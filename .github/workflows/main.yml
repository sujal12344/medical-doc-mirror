name: CI/CD Pipeline - Build & Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # ===================================================================
  # STAGE 1: BUILD & CACHE (Runs on GitHub-Hosted Runner)
  # ===================================================================
  build:
    name: Build & Cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore Next.js Build Caches
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: ${{ runner.os }}-nextjs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install Dependencies
        run: npm ci

      - name: Spin up Ephemeral Redis Container
        run: |
          docker run -d \
            --name "ci-redis-${{ github.run_id }}" \
            -p 63799:6379 \
            redis:7-alpine
          sleep 2

      - name: Build Next.js Application
        run: npm run build
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/placeholder"
          OPENAI_API_KEY: "mock-key"
          AGENT_MODEL: "mock-model"
          BETTER_AUTH_SECRET: "mock-secret-at-least-32-chars-long-security"
          BETTER_AUTH_URL: "http://localhost:3000"
          PINECONE_API_KEY: "mock-key"
          REDIS_URL: "redis://127.0.0.1:63799"
          SKIP_ENV_VALIDATION: "1"
          NEXT_DISABLE_SOURCEMAPS: "1"

      - name: Verify Standalone Output Build Exists
        run: |
          echo "=== Debug: Verifying Next.js Standalone Output ==="
          if [ ! -d ".next/standalone" ]; then
            echo "❌ ERROR: Standalone output directory missing!"
            echo "Ensure 'output: \"standalone\"' is set in next.config.ts."
            exit 1
          fi
          echo "✅ Root standalone directory found."

      - name: Cleanup Ephemeral Redis
        if: always()
        run: |
          docker rm -f "ci-redis-${{ github.run_id }}" 2>/dev/null || true

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ github.sha }}
          path: ./
          retention-days: 1

  # ===================================================================
  # STAGE 2: DEPLOY & FAIL-SAFE ROLLBACK (EC2 Deployment via SSH)
  # ===================================================================
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ github.sha }}
          path: ./

      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts || true
          ssh-keyscan -t rsa,ed25519 -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync Workspace Files to EC2 Server
        run: |
          rsync -avz --delete \
            --rsync-path="/usr/bin/rsync" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='google-bucket.json' \
            -e "ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3" \
            ./ ${{ secrets.REMOTE_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.REMOTE_USER }}/medical-doc-generator/

      - name: Execute Server Deployment & Health Check
        run: |
          ssh ${{ secrets.REMOTE_USER }}@${{ secrets.SERVER_IP }} "bash -s" << 'EOF'
            set -euo pipefail

            # Environment setup
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin:$PATH"

            cd ~/medical-doc-generator

            echo "=== Diagnostic Check: Server Environment ==="
            echo "Current User: $(whoami)"
            echo "Working Dir: $(pwd)"
            echo "Node Version: $(node -v)"

            echo "=== Creating Safety Backup ==="
            if [ -d ".next/standalone" ]; then
              rm -rf .next/standalone_backup
              cp -r .next/standalone .next/standalone_backup
              echo "Backup created at .next/standalone_backup"
            fi

            echo "=== Installing Production Dependencies ==="
            npm ci --omit=dev --engine-strict=false

            echo "=== Populating Standalone Assets ==="
            mkdir -p .next/standalone/public
            mkdir -p .next/standalone/.next/static

            if [ -d "public" ]; then
              cp -r public/. .next/standalone/public/ 2>/dev/null || true
            fi

            if [ -d ".next/static" ]; then
              cp -r .next/static/. .next/standalone/.next/static/ 2>/dev/null || true
            fi

            echo "=== Reloading Application via PM2 ==="
            # Delete old non-standalone PM2 process if it exists, then start standalone server
            pm2 delete medical-doc-generator 2>/dev/null || true
            pm2 start .next/standalone/server.js --name "medical-doc-generator" --update-env

            echo "=== Executing Health Check ==="
            sleep 5

            HEALTH_PASSED=false
            if pm2 status | grep -q 'online'; then
              if curl -s -f http://localhost:3000/ > /dev/null || curl -s -f http://localhost:3005/ > /dev/null; then
                HEALTH_PASSED=true
              fi
            fi

            if [ "$HEALTH_PASSED" = true ]; then
              echo "✅ DEPLOYMENT SUCCESSFUL: Service is healthy."
              rm -rf .next/standalone_backup
              pm2 save
            else
              echo "❌ CRITICAL: Health check failed! Initiating rollback..."
              if [ -d ".next/standalone_backup" ]; then
                rm -rf .next/standalone
                mv .next/standalone_backup .next/standalone
                pm2 restart medical-doc-generator
                echo "⚠️ Rollback executed."
              fi
              echo "=== PM2 Error Logs ==="
              pm2 logs medical-doc-generator --lines 50 --err --nostream || true
              exit 1
            fi
          EOF
