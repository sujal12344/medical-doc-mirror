name: CI/CD Pipeline - Build & Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # ===================================================================
  # STAGE 1: BUILD & CACHE (Runs on GitHub-Hosted Runner)
  # ===================================================================
  build:
    name: Build & Cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore Next.js Build Caches
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: ${{ runner.os }}-nextjs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install Dependencies
        run: npm ci

      - name: Spin up Ephemeral Redis Container
        run: |
          docker run -d \
            --name "ci-redis-${{ github.run_id }}" \
            -p 63799:6379 \
            redis:7-alpine
          sleep 2

      - name: Build Next.js Application
        run: npm run build
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/placeholder"
          OPENAI_API_KEY: "mock-key"
          AGENT_MODEL: "mock-model"
          BETTER_AUTH_SECRET: "mock-secret-at-least-32-chars-long-security"
          BETTER_AUTH_URL: "http://localhost:3000"
          PINECONE_API_KEY: "mock-key"
          REDIS_URL: "redis://127.0.0.1:63799"
          SKIP_ENV_VALIDATION: "1"
          NEXT_DISABLE_SOURCEMAPS: "1"

      - name: Verify Standalone Output Build Exists
        run: |
          echo "=== Debug: Verifying Next.js Standalone Output ==="
          if [ -d ".next/standalone" ]; then
            echo "✅ Root standalone directory found."
          elif [ -d "apps/portal/.next/standalone" ]; then
            echo "✅ Sub-folder standalone directory found."
          else
            echo "❌ ERROR: Standalone output directory missing!"
            echo "Ensure 'output: \"standalone\"' is set in next.config.ts / next.config.js."
            exit 1
          fi

      - name: Cleanup Ephemeral Redis
        if: always()
        run: |
          docker rm -f "ci-redis-${{ github.run_id }}" 2>/dev/null || true

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ github.sha }}
          path: |
            ./
          retention-days: 1

  # ===================================================================
  # STAGE 2: DEPLOY & FAIL-SAFE ROLLBACK (EC2 Deployment via SSH)
  # ===================================================================
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ github.sha }}
          path: ./

      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Sync Workspace Files to EC2 Server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='google-bucket.json' \
            ./ ${{ secrets.REMOTE_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.REMOTE_USER }}/karyaos/

      - name: Execute Server Deployment & Health Check
        run: |
          ssh ${{ secrets.REMOTE_USER }}@${{ secrets.SERVER_IP }} "bash -s" << 'EOF'
            set -euo pipefail

            # Environment setup
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin:$PATH"

            cd ~/karyaos

            echo "=== Diagnostic Check: Server Environment ==="
            echo "Current User: $(whoami)"
            echo "Working Dir: $(pwd)"
            echo "Node Version: $(node -v)"
            echo "NPM Version: $(npm -v)"

            echo "=== Creating Safety Backup of Current Deployment ==="
            STANDALONE_DIR=".next/standalone"
            if [ -d "apps/portal/.next/standalone" ]; then
              STANDALONE_DIR="apps/portal/.next/standalone"
            fi

            if [ -d "$STANDALONE_DIR" ]; then
              rm -rf "${STANDALONE_DIR}_backup"
              cp -r "$STANDALONE_DIR" "${STANDALONE_DIR}_backup"
              echo "Backup created at ${STANDALONE_DIR}_backup"
            else
              echo "No previous standalone directory found to back up."
            fi

            echo "=== Installing Production Dependencies ==="
            npm ci --omit=dev

            echo "=== Populating Next.js Standalone Assets ==="
            mkdir -p "$STANDALONE_DIR/public"
            mkdir -p "$STANDALONE_DIR/.next/static"

            if [ -d "public" ]; then
              cp -r public/. "$STANDALONE_DIR/public/" 2>/dev/null || true
            fi

            if [ -d ".next/static" ]; then
              cp -r .next/static/. "$STANDALONE_DIR/.next/static/" 2>/dev/null || true
            fi

            echo "=== Reloading Application via PM2 ==="
            pm2 startOrReload ecosystem.config.js --update-env

            echo "=== Executing Health Check & Automatic Rollback Safeguard ==="
            sleep 5

            HEALTH_PASSED=false
            if pm2 status | grep -q 'online'; then
              if curl -s -f http://localhost:3000/ > /dev/null || curl -s -f http://localhost:3005/ > /dev/null; then
                HEALTH_PASSED=true
              fi
            fi

            if [ "$HEALTH_PASSED" = true ]; then
              echo "✅ DEPLOYMENT SUCCESSFUL: Service is healthy."
              rm -rf "${STANDALONE_DIR}_backup"
              pm2 save
            else
              echo "❌ CRITICAL: Health check failed! Initiating rollback..."
              if [ -d "${STANDALONE_DIR}_backup" ]; then
                rm -rf "$STANDALONE_DIR"
                mv "${STANDALONE_DIR}_backup" "$STANDALONE_DIR"
                pm2 restart ecosystem.config.js
                echo "⚠️ Rollback executed. Restored previous deployment."
              else
                echo "❌ CRITICAL: No backup available to restore!"
              fi
              echo "=== Dumping PM2 Logs ==="
              pm2 logs --lines 50 --nostream || true
              exit 1
            fi

            docker system prune -f 2>/dev/null || true
          EOF
