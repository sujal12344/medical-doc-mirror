name: Auto-Sync Polling

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your mirror repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_OWN_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge from Upstream
        run:
          git remote add upstream https://${{ secrets.MY_OWN_PAT }}@github.com/A-r-y-a-n-123/medical-doc-generator.git
          git fetch upstream sujal
          git merge upstream/sujal --no-edit -m "Auto-sync from upstream sujal branch"
          git push origin main
